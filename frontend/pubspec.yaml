name: nnadsorption_app
description: Plataforma de predição de colunas de adsorção em leito fixo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Gerenciamento de estado simples — escolhido por ser o mais didático
  # (riverpod é mais poderoso mas provider basta aqui)
  provider: ^6.1.2

  # Gráficos interativos nativos no Flutter
  fl_chart: ^0.69.0

  # Chamadas HTTP ao backend
  http: ^1.2.2

  # Salva o token JWT no localStorage (web) ou SharedPreferences (mobile)
  shared_preferences: ^2.3.3

  # Roteamento declarativo com suporte a URL no browser
  go_router: ^14.6.2

  # Formatação de datas
  intl: ^0.19.0

  # Abre links (export CSV/XLSX) no browser
  url_launcher: ^6.3.1

  # Renderiza SVG (logo da UTFPR no rodapé)
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Tipografia: Archivo (display) + IBM Plex Sans (UI) + IBM Plex Mono (dados)
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Archivo-Black.ttf
          weight: 900
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

  assets:
    - assets/images/logo_dark.png
    - assets/images/logo_light.png
    - assets/images/UTFPR_logo.svg